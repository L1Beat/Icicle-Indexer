host: localhost:8080
info:
  contact: {}
  description: |-
    Avalanche P-Chain and EVM Indexer API

    ## Overview
    This API provides access to indexed Avalanche blockchain data including:
    - **Data API** (`/api/v1/data/*`): Blocks, transactions, subnets, validators, P-chain data
    - **Metrics API** (`/api/v1/metrics/*`): Fee statistics, chain metrics, time series data

    ## Rate Limiting
    All endpoints are rate limited to 180 requests/minute per IP (burst of 30) by default. Configurable via CLI flags.
  title: Icicle API
  version: "1.0"
paths:
  /api/v1/data/chains:
    get:
      description: Get a paginated list of chains with subnet info, L1 registry metadata,
        and validator stats
      parameters:
      - description: Filter by chain type (l1, legacy)
        in: query
        name: chain_type
        type: string
      - description: Filter by subnet ID
        in: query
        name: subnet_id
        type: string
      - description: Filter by category (e.g. DeFi, Gaming)
        in: query
        name: category
        type: string
      - description: Filter by active validators (true)
        in: query
        name: active
        type: string
      - default: 20
        description: Number of results (max 100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Cursor for keyset pagination
        in: query
        name: cursor
        type: string
      - description: Include total count (true/false)
        in: query
        name: count
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.ChainInfo'
                  type: array
                meta:
                  $ref: '#/definitions/api.Meta'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List chains
      tags:
      - Data - Subnets
  /api/v1/data/chains/{chainId}/risk:
    get:
      description: Validator-set decentralization (Nakamoto coefficient) plus, in
        later tiers, ValidatorManager control and economic security. Keyed by the
        same chain_id as /api/v1/data/chains.
      parameters:
      - description: Chain ID
        in: path
        name: chainId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.RiskResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get chain risk profile
      tags:
      - Data - Chains
  /api/v1/data/delegators/{address}/delegations:
    get:
      description: Primary Network AddDelegator / AddPermissionlessDelegator transactions
        whose reward owner includes this address, across all validators. meta.summary
        covers all of the address's delegations regardless of the active filter. Sorting
        and paging run in ClickHouse, so large staking services with millions of rows
        work. Stake is a nAVAX string. Cached for 5 minutes.
      parameters:
      - description: P-Chain address (P-avax1... or avax1...)
        in: path
        name: address
        required: true
        type: string
      - description: Filter by running (true) or ended (false)
        in: query
        name: active
        type: boolean
      - default: stake
        description: stake, end_time or start_time
        in: query
        name: sort
        type: string
      - default: desc
        description: desc or asc
        in: query
        name: order
        type: string
      - default: 20
        description: Page size, max 500
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DelegatorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List delegations by reward address
      tags:
      - Data - Validators
  /api/v1/data/evm/{chainId}/address/{address}/balances:
    get:
      description: Get all ERC-20 token balances for an address
