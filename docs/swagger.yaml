basePath: /
definitions:
  api.APIError:
    properties:
      code:
        $ref: '#/definitions/api.ErrorCode'
      details:
        type: string
      fields:
        items:
          $ref: '#/definitions/api.FieldError'
        type: array
      message:
        type: string
      retry_after:
        type: integer
    type: object
  api.AddressLabel:
    properties:
      implementation:
        example: 0x...
        type: string
      is_contract:
        example: true
        type: boolean
      kind:
        example: router
        type: string
      name:
        example: LFJ Router (v1)
        type: string
      protocol:
        example: LFJ
        type: string
      verified:
        example: true
        type: boolean
    type: object
  api.AvailableMetric:
    properties:
      data_points:
        example: 365
        type: integer
      granularities:
        example:
        - hour
        - day
        - week
        items:
          type: string
        type: array
      latest_period:
        type: string
      metric_name:
        example: tx_count
        type: string
    type: object
  api.Block:
    properties:
      base_fee_per_gas:
        example: 25000000000
        type: integer
      block_number:
        example: 12345678
        type: integer
      block_time:
        type: string
      burned:
        $ref: '#/definitions/api.BlockBurn'
      chain_id:
        example: 43114
        type: integer
      gas_limit:
        example: 8000000
        type: integer
      gas_used:
        example: 500000
        type: integer
      hash:
        example: 0x1234...
        type: string
      miner:
        example: 0x742d35Cc6634C0532925a3b844Bc9e7595f...
        type: string
      parent_hash:
        example: 0xabcd...
        type: string
      size:
        example: 1024
        type: integer
      tx_count:
        example: 150
        type: integer
    type: object
  api.BlockBurn:
    properties:
      base_fee:
        description: sum(gas_used * base_fee_per_gas)
        example: "100000000"
        type: string
      priority_fee:
        description: total - base
        example: "23456789"
        type: string
      total:
        description: sum(gas_used * gas_price)
        example: "123456789"
        type: string
    type: object
  api.BridgeChain:
    properties:
      avalanche_l1:
        type: boolean
      bridges:
        description: |-
          Bridges splits the chain's flow by bridge, only bridges that moved
          something. Their USD adds up to the chain's.
        items:
          $ref: '#/definitions/api.BridgeDayBridge'
        type: array
      chain:
        description: key, e.g. ethereum, base, bitcoin
        type: string
      flagged_transfers:
        type: integer
      inflow_usd:
        type: number
      name:
        type: string
      net_usd:
        description: inflow - outflow
        type: number
      outflow_usd:
        type: number
      priced_share:
        description: priced transfers / transfers, 0-1
        type: number
      transfers:
        type: integer
    type: object
  api.BridgeDay:
    properties:
      bridges:
        items:
          $ref: '#/definitions/api.BridgeDayBridge'
        type: array
      date:
        type: string
      inflow_usd:
        type: number
      net_usd:
        type: number
      outflow_usd:
        type: number
      transfers:
        type: integer
    type: object
  api.BridgeDayBridge:
    properties:
      id:
        type: string
      inflow_usd:
        type: number
      outflow_usd:
        type: number
      transfers:
        type: integer
    type: object
  api.BridgeOverview:
    properties:
      as_of:
        description: last complete UTC day, null before the first one
        type: string
      by_bridge:
        items:
          $ref: '#/definitions/api.BridgeStats'
        type: array
      by_chain:
        items:
          $ref: '#/definitions/api.BridgeChain'
        type: array
      by_token:
        items:
          $ref: '#/definitions/api.BridgeToken'
        type: array
      days:
        type: integer
      flag_threshold_usd:
        type: number
      from:
        type: string
      totals:
        $ref: '#/definitions/api.BridgeTotals'
    type: object
  api.BridgeStats:
    properties:
      flagged_transfers:
        type: integer
      id:
        type: string
      inflow_usd:
        type: number
      name:
        type: string
      net_usd:
        description: inflow - outflow
        type: number
      outflow_usd:
        type: number
      priced_share:
        description: priced transfers / transfers, 0-1
        type: number
      transfers:
        type: integer
    type: object
  api.BridgeToken:
    properties:
      decimals:
        description: null when unknown
        type: integer
      inflow_amount:
        description: token base units
        type: string
      inflow_usd:
        type: number
      net_usd:
        type: number
      outflow_amount:
        description: token base units
        type: string
      outflow_usd:
        type: number
      priced:
        type: boolean
      symbol:
        type: string
      token:
        type: string
      transfers:
        type: integer
    type: object
  api.BridgeTotals:
    properties:
      flagged_transfers:
        type: integer
      inflow_usd:
        type: number
      net_usd:
        description: inflow - outflow
        type: number
      outflow_usd:
        type: number
      passthrough_count:
        description: |-
          PassthroughCount is the transactions that bridged in and out again in
          one go (e.g. a CCTP mint forwarded straight to another chain). Their legs
          are left out of every figure.
        type: integer
      priced_share:
        description: priced transfers / transfers, 0-1
        type: number
      transfers:
        type: integer
    type: object
  api.BridgeTransfer:
    properties:
      amount:
        type: string
      bridge:
        type: string
      chain:
        type: string
      chain_name:
        type: string
      decimals:
        type: integer
      direction:
        description: in, out
        type: string
      from:
        description: C-Chain sender (out), null when unknown
        type: string
      passthrough:
        type: boolean
      symbol:
        type: string
      time:
        type: string
      to:
        description: C-Chain recipient (in), null when unknown
        type: string
      token:
        type: string
      tx_hash:
        type: string
      usd:
        type: number
      via:
        type: string
    type: object
  api.BurnedByChain:
    properties:
      c_chain:
        type: string
      p_chain:
        type: string
      x_chain:
        type: string
    type: object
  api.ChainInfo:
    properties:
      active_validators:
        type: integer
      categories:
        items:
          type: string
        type: array
      chain_id:
        description: Chain identity
        type: string
      chain_name:
        type: string
      chain_type:
        type: string
      converted_block:
        type: integer
      converted_time:
        type: string
      created_block:
        description: Null when the chain's CreateChainTx is not indexed.
        type: integer
      created_time:
        type: string
      decentralization:
        allOf:
        - $ref: '#/definitions/api.Decentralization'
        description: Decentralization summary (compact; only for chains with active
          L1 validators)
      description:
        type: string
      evm_chain_id:
        description: Extended registry fields
        type: integer
      explorer_url:
        type: string
      is_active:
        description: Status
        type: boolean
      logo_url:
        type: string
      name:
        description: Registry metadata
        type: string
      network:
        type: string
      network_token:
        $ref: '#/definitions/api.NetworkToken'
      rpc_url:
        type: string
      socials:
        items:
          $ref: '#/definitions/api.SocialLink'
        type: array
      staked_token:
        description: StakedToken is the symbol of the staked token (PoS only).
        type: string
      staking_model:
        description: |-
          StakingModel is "pos", "poa" or "unknown": from the on-chain
          ValidatorManager type, else the registry's sybil_resistance_type, else
          "pos" when the registry has a staking factor. The Primary Network is pos.
        type: string
      subnet_id:
        description: Parent subnet
        type: string
      sybil_resistance_type:
        type: string
      total_fees_paid:
        type: integer
      total_staked:
        description: raw weight of ACTIVE validators
        type: integer
      total_staked_tokens:
        description: |-
          TotalStakedTokens is total_staked converted to WHOLE tokens (PoS only;
          omitted for PoA / unresolved chains). Decimal string, full precision.
        type: string
      validator_count:
        description: L1 stats (only for L1s)
        type: integer
      validator_manager_address:
        type: string
      validator_manager_owner:
        type: string
      vm_id:
        type: string
      website_url:
        type: string
    type: object
  api.ChainMetrics:
    properties:
      avg_block_time_seconds:
        example: 2
        type: number
      avg_gas_used:
        example: 500000
        type: number
      chain_id:
        example: 43114
        type: integer
      chain_name:
        example: C-Chain
        type: string
      last_block_time:
        type: string
      latest_block:
        example: 12345678
        type: integer
      total_blocks:
        example: 12345678
        type: integer
      total_gas_used:
        example: 50000000000000
        type: integer
      total_txs:
        example: 100000000
        type: integer
    type: object
  api.ChurnInfo:
    properties:
      max_churn_percentage:
        type: integer
      period_seconds:
        type: integer
    type: object
  api.DailyFeeBurn:
    properties:
      active_validators:
        example: 5
        type: integer
      date:
        example: "2025-01-15"
        type: string
      total_fees_burned:
        example: 44236800
        type: integer
      validators:
        items:
          $ref: '#/definitions/api.ValidatorDailyFeeBurn'
        type: array
    type: object
  api.Decentralization:
    properties:
      active_validator_count:
        type: integer
      nakamoto_33:
        description: min validators controlling more than 1/3 of active weight; null
          if unknown
        type: integer
      nakamoto_50:
        description: min validators controlling more than 1/2 of active weight; null
          if unknown
        type: integer
      total_weight:
        description: sum of active validator weights, raw
        type: string
      weights:
        description: active validator weights sorted desc, raw (full detail only)
        items:
          type: string
        type: array
    type: object
  api.DelegationFees:
    properties:
      histogram:
        items:
          $ref: '#/definitions/api.FeeBucket'
        type: array
      median_percent:
        type: number
    type: object
  api.DelegatorDelegation:
    properties:
      active:
        type: boolean
      end_time:
        type: string
      node_id:
        type: string
      stake:
        description: nAVAX
        type: string
      start_time:
        type: string
      tx_id:
        type: string
    type: object
  api.DelegatorMeta:
    properties:
      has_more:
        type: boolean
      limit:
        type: integer
      next_cursor:
        type: string
      offset:
        type: integer
      summary:
        $ref: '#/definitions/api.DelegatorSummary'
      total:
        type: integer
    type: object
  api.DelegatorResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/api.DelegatorDelegation'
        type: array
      meta:
        $ref: '#/definitions/api.DelegatorMeta'
    type: object
  api.DelegatorSummary:
    properties:
      active_count:
        type: integer
      active_stake:
        description: nAVAX
        type: string
      first_delegation_time:
        type: string
      validator_count:
        description: distinct nodes among active delegations
        type: integer
    type: object
  api.DexDay:
    properties:
      date:
        type: string
      dexes:
        items:
          $ref: '#/definitions/api.DexDayDex'
        type: array
      swaps:
        type: integer
      volume_usd:
        type: number
    type: object
  api.DexDayDex:
    properties:
      id:
        type: string
      swaps:
        type: integer
      volume_usd:
        type: number
    type: object
  api.DexOverview:
    properties:
      as_of:
        description: last complete UTC day, null before the first rollup
        type: string
      days:
        type: integer
      dexes:
        items:
          $ref: '#/definitions/api.DexStats'
        type: array
      flag_threshold_usd:
        type: number
      from:
        type: string
      totals:
        $ref: '#/definitions/api.DexStats'
    type: object
  api.DexPool:
    properties:
      dex:
        type: string
      pool:
        type: string
      protocol:
        type: string
      swaps:
        type: integer
      token0:
        $ref: '#/definitions/api.DexToken'
      token1:
        $ref: '#/definitions/api.DexToken'
      volume_usd:
        type: number
    type: object
  api.DexStats:
    properties:
      flagged_swaps:
        type: integer
      id:
        type: string
      name:
        type: string
      priced_share:
        description: priced swaps / swaps, 0-1
        type: number
      protocol:
        type: string
      swaps:
        type: integer
      unique_addresses:
        type: integer
      volume_usd:
        type: number
    type: object
  api.DexToken:
    properties:
      address:
        type: string
      symbol:
        type: string
    type: object
  api.EVMChainStatus:
    properties:
      blocks_behind:
        example: 22
        type: integer
      chain_id:
        example: 43114
        type: integer
      current_block:
        example: 12345678
        type: integer
      is_synced:
        example: true
        type: boolean
      last_sync:
        type: string
      latest_block:
        example: 12345700
        type: integer
      name:
        example: C-Chain
        type: string
    type: object
  api.EconomicSecurity:
    properties:
      cost_to_control_33_usd:
        type: number
      staking_token:
        $ref: '#/definitions/api.NetworkToken'
      total_stake_raw:
        description: not populated yet (always empty)
        type: string
      total_stake_usd:
        type: number
    type: object
  api.ErrorCode:
    enum:
    - INVALID_PARAMETER
    - NOT_FOUND
    - INTERNAL_ERROR
    - RATE_LIMITED
    - VALIDATION_FAILED
    - DATABASE_ERROR
    type: string
    x-enum-varnames:
    - ErrInvalidParameter
    - ErrNotFound
    - ErrInternalError
    - ErrRateLimited
    - ErrValidationFailed
    - ErrDatabaseError
  api.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/api.APIError'
    type: object
  api.FeeBucket:
    properties:
      label:
        type: string
      max_percent:
        type: number
      min_percent:
        type: number
      total_stake:
        description: nAVAX, own + delegated
        type: string
      validator_count:
        type: integer
    type: object
  api.FeeBurnPoint:
    properties:
      base_fee_burned:
        description: nAVAX
        example: "100000000"
        type: string
      period:
        type: string
      priority_fee_burned:
        description: nAVAX
        example: "23456789"
        type: string
      total_burned:
        description: nAVAX
        example: "123456789"
        type: string
    type: object
  api.FeeBurnResponse:
    properties:
      chain_id:
        example: 43114
        type: integer
      cumulative:
        $ref: '#/definitions/api.FeeBurnTotals'
      granularity:
        example: day
        type: string
      series:
        items:
          $ref: '#/definitions/api.FeeBurnPoint'
        type: array
      unit:
        example: nAVAX
        type: string
    type: object
  api.FeeBurnTotals:
    properties:
      base_fee_burned:
        description: nAVAX
        type: string
      priority_fee_burned:
        description: nAVAX
        type: string
      total_burned:
        description: nAVAX
        type: string
    type: object
  api.FeeStats:
    properties:
      current_balance:
        example: 85000000000
        type: integer
      deposit_tx_count:
        example: 15
        type: integer
      initial_deposits:
        example: 80000000000
        type: integer
      subnet_id:
        example: 2XDnKyAEr...
        type: string
      top_up_deposits:
        example: 20000000000
        type: integer
      total_deposited:
        example: 100000000000
        type: integer
      total_fees_paid:
        example: 5000000000
        type: integer
      total_refunded:
        example: 10000000000
        type: integer
      validator_count:
        example: 5
        type: integer
    type: object
  api.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  api.GenesisAllocation:
    properties:
      address:
        description: |-
          Address is the bech32 AVAX address without a chain prefix: the unlocked
          amount was created on the X-Chain and the locked tranches on the P-Chain.
        type: string
      eth_address:
        type: string
      index:
        description: position in the genesis config
        type: integer
      initially_staked:
        type: boolean
      total:
        description: nAVAX
        type: string
      unlock_schedule:
        description: |-
          UnlockSchedule was locked on the P-Chain until each unlock time. For an
          initially staked address these tranches were staked by the genesis
          validators instead.
        items:
          $ref: '#/definitions/api.GenesisUnlock'
        type: array
      x_chain_amount:
        description: XChainAmount was spendable on the X-Chain at genesis.
        type: string
    type: object
  api.GenesisOverview:
    properties:
      avax_asset_id:
        type: string
      c_chain_genesis:
        type: object
      c_chain_id:
        type: string
      initial_stake_duration_seconds:
        type: integer
      initial_validators:
        items:
          $ref: '#/definitions/api.GenesisValidator'
        type: array
      initially_staked_addresses:
        items:
          type: string
        type: array
      message:
        type: string
      network_id:
        type: integer
      p_chain_genesis_block_id:
        type: string
      start_time:
        type: string
      supply:
        $ref: '#/definitions/api.GenesisSupply'
      unlock_schedule:
        items:
          $ref: '#/definitions/api.GenesisUnlockBucket'
        type: array
      x_chain_id:
        type: string
    type: object
  api.GenesisSupply:
    properties:
      allocation_count:
        type: integer
      initially_staked:
        description: staked by the genesis validators
        type: string
      initially_staked_address_count:
        type: integer
      p_chain_locked:
        description: locked on the P-Chain until each tranche's unlock time
        type: string
      total:
        description: nAVAX
        type: string
      x_chain_unlocked:
        description: spendable on the X-Chain at genesis
        type: string
    type: object
  api.GenesisUnlock:
    properties:
      amount:
        description: nAVAX
        type: string
      unlock_time:
        description: locked on the P-Chain until this time
        type: string
    type: object
  api.GenesisUnlockBucket:
    properties:
      amount:
        description: nAVAX
        type: string
      unlock_time:
        type: string
    type: object
  api.GenesisValidator:
    properties:
      delegation_fee_percent:
        type: number
      end_time:
        type: string
      node_id:
        type: string
      reward_address:
        type: string
      start_time:
        type: string
    type: object
  api.HealthStatus:
    properties:
      database:
        example: connected
        type: string
      status:
        example: healthy
        type: string
    type: object
  api.ICMApp:
    properties:
      address:
        type: string
      first_seen:
        description: all time, not just the window
        type: string
      kind:
        description: ictt-home, ictt-remote or other
        type: string
      label:
        $ref: '#/definitions/api.AddressLabel'
      last_seen:
        type: string
      name:
        description: label name, else e.g. "XOM ICTT remote", else empty
        type: string
      received:
        description: received on the C-Chain
        type: integer
      sent:
        description: sent from the C-Chain
        type: integer
      token:
        allOf:
        - $ref: '#/definitions/api.ICMToken'
        description: ICTT apps only
      top_chains:
        description: busiest other chains in the window, up to 5
        items:
          $ref: '#/definitions/api.ICMChain'
        type: array
      total:
        type: integer
    type: object
  api.ICMAppDay:
    properties:
      address:
        type: string
      name:
        type: string
      received:
        description: received on the C-Chain
        type: integer
      sent:
        description: sent from the C-Chain
        type: integer
      total:
        type: integer
    type: object
  api.ICMAppRef:
    properties:
      kind:
        type: string
      label:
        $ref: '#/definitions/api.AddressLabel'
      name:
        type: string
    type: object
  api.ICMApps:
    properties:
      apps:
        items:
          $ref: '#/definitions/api.ICMApp'
        type: array
      as_of:
        description: last complete UTC day, null before the first one
        type: string
      days:
        type: integer
      from:
        type: string
    type: object
  api.ICMChain:
    properties:
      blockchain_id:
        description: CB58
        type: string
      name:
        description: from the L1 registry, empty when unlisted
        type: string
      received:
        description: received on the C-Chain
        type: integer
      sent:
        description: sent from the C-Chain
        type: integer
      total:
        type: integer
    type: object
  api.ICMChainRef:
    properties:
      blockchain_id:
        type: string
      name:
        type: string
    type: object
  api.ICMChainValue:
    properties:
      blockchain_id:
        type: string
      name:
        type: string
      received_usd:
        type: number
      sent_usd:
        type: number
      total_usd:
        type: number
      transfers:
        type: integer
    type: object
  api.ICMCounts:
    properties:
      received:
        description: received on the C-Chain
        type: integer
      sent:
        description: sent from the C-Chain
        type: integer
      total:
        type: integer
    type: object
  api.ICMDay:
    properties:
      by_app:
        description: with by_app=true, left out on quiet days
        items:
          $ref: '#/definitions/api.ICMAppDay'
        type: array
      by_chain:
        items:
          $ref: '#/definitions/api.ICMChain'
        type: array
      date:
        type: string
      received:
        description: received on the C-Chain
        type: integer
      sent:
        description: sent from the C-Chain
        type: integer
      total:
        type: integer
    type: object
  api.ICMICTTValue:
    properties:
      amount_raw:
        description: as encoded in the message, before any decimals scaling between
          home and remote
        type: string
      recipient:
        type: string
      token:
        $ref: '#/definitions/api.ICMToken'
      type:
        description: single_hop_send, single_hop_call, multi_hop_send, multi_hop_call,
          register_remote
        type: string
    type: object
  api.ICMMessage:
    properties:
      app:
        $ref: '#/definitions/api.ICMAppRef'
      block_number:
        type: integer
      block_time:
        type: string
      counterparty:
        $ref: '#/definitions/api.ICMChainRef'
      deliverer:
        description: 'receives only: the relayer'
        type: string
      direction:
        description: sent (from the C-Chain) or received (on it)
        type: string
      executed:
        description: 'receives only: MessageExecuted seen, on receipt or a retry'
        type: boolean
      fee_amount:
        description: sends only, in fee token units
        type: string
      fee_token:
        description: sends only
        type: string
