    get:
      description: Daily USD in and out of the C-Chain, total and per bridge, for
        the last N complete UTC days ending as_of. Oldest first, days without transfers
        left out. Same counting as /metrics/bridges. Cached for 5 minutes.
      parameters:
      - default: 90
        description: Complete UTC days, 1-3650
        in: query
        name: days
        type: integer
