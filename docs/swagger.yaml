  /api/v1/data/evm/{chainId}/rwa:
    get:
      description: 'Returns every tokenized real-world asset in the registry that
        is not a stablecoin: fund shares (category tokenized_fund, the /tokenized-funds
        rows), company shares (category equity, e.g. Securitize SECZ) and commodities
        (category commodity, e.g. Tether gold XAUt0, peg XAU, one token per troy ounce).
        Same row shape and price fields as /tokenized-funds. supply is in token units.
        An equity price comes from its RedStone end-of-day price feed (price_source
        redstone). XAUt0 has no verified on-chain gold price yet, so its price fields
        are null. Rows are sorted by value_usd, highest first, unpriced rows last.'
      parameters:
      - description: Chain ID (e.g. 43114 for Avalanche C-Chain)
        in: path
        name: chainId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
