  /api/v1/metrics/icm/apps:
    get:
      description: 'C-Chain contracts sending or receiving ICM messages over the last
        N complete UTC days ending as_of: sends from them (originSenderAddress), receives
        to them (destinationAddress), their busiest other chains, and first and last
        message all time. ICTT token bridges are marked ictt-home or ictt-remote after
        an on-chain check, with their token. Names come from address labels, else
        the ICTT token. Busiest first. Cached for 5 minutes.'
      parameters:
      - default: 30
        description: Complete UTC days, 1-3650
        in: query
        name: days
        type: integer
      - default: 50
        description: Apps, 1-200
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.ICMApps'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: C-Chain ICM apps
      tags:
      - Metrics - ICM
  /api/v1/metrics/icm/messages:
    get:
      description: ICM messages sent from or received on the C-Chain, newest first,
        with the C-Chain contract and L1 address, relayer fee (sends), deliverer and
        reward redeemer (receives), and the ICTT payload for ICTT apps. Page with
        before=meta.next_cursor. Cached for 1 minute.
      parameters:
      - default: 50
        description: Messages, 1-200
        in: query
        name: limit
        type: integer
      - description: Cursor from meta.next_cursor
        in: query
        name: before
        type: string
      - description: Other chain's blockchain ID (CB58)
        in: query
        name: chain
        type: string
      - description: sent or received
        in: query
        name: direction
        type: string
      - description: C-Chain contract address
        in: query
        name: app
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.ICMMessage'
                  type: array
                meta:
                  $ref: '#/definitions/api.Meta'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Recent C-Chain ICM messages
      tags:
      - Metrics - ICM
  /api/v1/metrics/icm/timeseries:
    get:
      description: Messages sent from and received on the C-Chain per UTC day, total
        and per other chain, for the last N complete days ending as_of. With by_app=true,
        also per C-Chain contract (see /metrics/icm/apps). Oldest first, every day
        included (zero when quiet), from 2024-03-05. Cached for 5 minutes.
      parameters:
      - default: 90
        description: Complete UTC days, 1-3650
        in: query
        name: days
        type: integer
      - description: Add the per-app split
        in: query
        name: by_app
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.ICMDay'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: C-Chain ICM (Teleporter) messages per day
      tags:
      - Metrics - ICM
  /api/v1/metrics/icm/transfers/top:
    get:
      description: The largest priced ICTT transfers on the C-Chain by USD over the
        last N complete UTC days ending as_of. Cached for 5 minutes.
      parameters:
      - default: 30
        description: Complete UTC days, 1-3650
        in: query
        name: days
        type: integer
      - default: 50
        description: Transfers, 1-200
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.ICMTransfer'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Largest C-Chain ICTT transfers
      tags:
      - Metrics - ICM
  /api/v1/metrics/icm/value:
    get:
      description: 'Token value moved by ICTT token bridges (TokenHome / TokenRemote)
        on the C-Chain over the last N complete UTC days ending as_of: sent (left
        the C-Chain) and received (arrived on it, once executed), total, per token
        and per other chain. Amounts are C-Chain token base units: a TokenHome''s
        messages are scaled back from the remote''s denomination with the remote''s
        registered multiplier. Priced by token address like /metrics/bridges (USD
        stablecoins and legacy AEB USD tokens at $1; WAVAX, the ETH tokens WETH.e
        and AEB ETH, the BTC tokens BTC.b, WBTC.e, the WBTC OFT, LBTC and AEB WBTC,
        and LINK.e and AEB LINK at their hourly Chainlink price); other tokens have
        no USD. A multi-hop transfer through a C-Chain home counts once. Cached for
        5 minutes.'
      parameters:
      - default: 30
        description: Complete UTC days, 1-3650
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.ICMValue'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: C-Chain ICTT value
      tags:
      - Metrics - ICM
  /api/v1/metrics/icm/value/timeseries:
    get:
      description: Daily USD sent and received by ICTT token bridges on the C-Chain,
        with transfers and a per-token split, for the last N complete UTC days ending
        as_of. Oldest first, every day included. Same scaling and pricing as /metrics/icm/value.
        Cached for 5 minutes.
      parameters:
      - default: 90
        description: Complete UTC days, 1-3650
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.ICMValueDay'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: C-Chain ICTT value per day
      tags:
      - Metrics - ICM
  /api/v1/metrics/indexer/status:
    get:
      description: Get sync status for all indexed chains
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.IndexerStatus'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get indexer status
      tags:
      - Metrics - Indexer
  /api/v1/metrics/lending:
    get:
      description: Supply, borrow, rates and risk parameters of every market on Aave
        V3, Aave V4 (Core Hub) and BENQI Lending, read from the contracts by the indexer
        every C-Chain snapshot cycle (5 minutes by default, `cchainSnapshotInterval`)
        and cached for 2 minutes. Amounts are token base units. APYs compound the
        per-second rate. USD values use each protocol's own oracle and are null when
        its read failed. The summary sums AVAX (WAVAX on Aave, native AVAX on BENQI)
        and sAVAX across protocols.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.LendingOverview'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: C-Chain lending markets
      tags:
      - Metrics - Staking
  /api/v1/metrics/lending/liquidations:
    get:
      description: 'Executed liquidations on Aave V3, Aave V4 and BENQI per UTC day:
        count, repaid and seized USD (oracle value at the event block), split by protocol
        and by collateral asset. USD sums cover priced liquidations only; unpriced
        counts those missing a price. Today''s partial day is included. Oldest first.
        Cached for 5 minutes.'
      parameters:
      - default: 30
        description: Days back, 1-3650
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.LiqDay'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Lending liquidations per day
      tags:
      - Metrics - Staking
  /api/v1/metrics/lending/liquidations/recent:
    get:
      description: The latest executed liquidations on Aave V3, Aave V4 and BENQI,
        newest first. min_usd keeps those whose repaid or seized value is at least
        that much. Cached for 5 minutes.
      parameters:
      - default: 50
        description: Rows, 1-500
        in: query
        name: limit
        type: integer
      - description: Minimum repaid or seized USD
        in: query
        name: min_usd
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.LiqEvent'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Recent lending liquidations
      tags:
      - Metrics - Staking
  /api/v1/metrics/lending/liquidations/top:
    get:
      description: The largest executed liquidations by seized USD over the last N
        days (today included), on Aave V3, Aave V4 and BENQI. Cached for 5 minutes.
      parameters:
      - default: 30
        description: Days back, 1-3650
        in: query
        name: days
        type: integer
      - default: 20
        description: Rows, 1-100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.LiqEvent'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Largest lending liquidations
      tags:
      - Metrics - Staking
  /api/v1/metrics/lending/timeseries:
    get:
      description: Daily supplied, borrowed and rates of AVAX (WAVAX on Aave, native
        AVAX on BENQI) or sAVAX across Aave V3, Aave V4 and BENQI, from the last sample
        of each UTC day. Amounts are wei strings (18 decimals). With market=<protocol_id>:<asset>,
        returns that one market's daily history instead. Past days are read at the
        day's last block on the archive node, about a year back. Oldest first.
      parameters:
      - description: avax or savax (when market is not set)
        in: query
        name: asset
        type: string
      - description: One market as <protocol_id>:<asset address>, e.g. aave-v3:0xb31f66aa3c1e785363f0875a1b74e27b85fd66c7.
          Returns []LendingMarketPoint instead
        in: query
        name: market
        type: string
      - default: 365
        description: Days back, 1-3650
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.LendingPoint'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Lending history for AVAX or sAVAX
      tags:
      - Metrics - Staking
  /api/v1/metrics/lending/timeseries/totals:
    get:
      description: Daily supplied and borrowed USD per protocol (Aave V3, Aave V4,
        BENQI) and overall, from each market's daily sample and its oracle price that
        day. Markets without a price are left out. Oldest first. Cached for 10 minutes.
      parameters:
      - default: 365
        description: Days back, 1-3650
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.LendingTotalsPoint'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Lending USD totals history
      tags:
      - Metrics - Staking
  /api/v1/metrics/perps:
    get:
      description: Volume, long/short split, trades, traders, fees and liquidations
        per venue (GMX V2, GMX V1) over the last N complete UTC days ending as_of.
        Volume is the USD size change of every increase, decrease and liquidation,
        as GMX reports it. Fees are position, borrowing and liquidation fees (funding
        is not a fee). traders counts distinct accounts that changed a position size.
        Cached for 5 minutes.
      parameters:
      - default: 30
        description: Complete UTC days, 1-3650
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.PerpOverview'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: C-Chain perpetuals
      tags:
      - Metrics - Perps
  /api/v1/metrics/perps/liquidations/top:
    get:
      description: Liquidations with the largest position size over the last N complete
        UTC days ending as_of. collateral_usd is the collateral the position held.
        Cached for 5 minutes.
      parameters:
      - default: 30
        description: Complete UTC days, 1-3650
        in: query
        name: days
        type: integer
      - default: 25
        description: Liquidations, 1-100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.PerpLiquidation'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Largest C-Chain perpetuals liquidations
      tags:
      - Metrics - Perps
  /api/v1/metrics/perps/open-interest:
    get:
      description: Long and short open interest in USD at the end of each complete
        UTC day, total and per market, for the last N days ending as_of. GMX V2 from
        its OpenInterestUpdated events, GMX V1 from the sum of its position size changes.
        Markets with no open interest are left out. Cached for 5 minutes.
      parameters:
      - default: 90
        description: Complete UTC days, 1-3650
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.PerpOIDay'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: C-Chain perpetuals open interest
      tags:
      - Metrics - Perps
  /api/v1/metrics/perps/timeseries:
    get:
      description: Daily volume, trades, fees and liquidated size, total and per venue,
        for the last N complete UTC days ending as_of. Oldest first, days without
        trades left out. Cached for 5 minutes.
      parameters:
      - default: 90
        description: Complete UTC days, 1-3650
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.PerpDay'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: C-Chain perpetuals history
      tags:
      - Metrics - Perps
  /api/v1/metrics/restaking:
    get:
      description: L1s whose validators are secured by restaking vaults on the C-Chain
        (Suzaku). Each L1 lists its vaults with deposited, allocated (delegated to
        the L1's operators) and idle collateral in token base units, and the share
        of the L1's active P-Chain validator weight held by validators the protocol
        registered. Every L1 in the Suzaku L1Registry with at least one vault is included,
        active or not. Sampled by the indexer every C-Chain snapshot cycle (5 minutes
        by default, `cchainSnapshotInterval`) and cached for 5 minutes.
      parameters:
      - description: Only this L1 subnet ID
        in: query
        name: subnet_id
        type: string
      - description: Only the L1 with this blockchain ID
        in: query
        name: chain_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.RestakingOverview'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Restaked collateral per L1
      tags:
      - Metrics - Staking
  /api/v1/metrics/staking:
    get:
      description: Own and delegated stake, validator/delegation counts, delegation
        fee distribution, stake concentration (top N share, Nakamoto) and share of
        AVAX total supply staked. Amounts are nAVAX strings. Cached for 1 minute,
        source refreshes every 5.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.StakingSummary'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Primary Network staking summary
      tags:
      - Metrics - Staking
  /api/v1/metrics/staking/liquid:
    get:
      description: AVAX liquid staking tokens with pooled AVAX, token supply and exchange
        rate from the C-Chain contract, and running delegations whose rewards go to
        the protocol's P-Chain addresses. Sampled by the indexer every validator sync
        cycle (hourly on api.l1beat.io). attribution says whether the P-Chain addresses
        are confirmed by the protocol. Amounts are nAVAX strings. Cached for 5 minutes.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.LiquidStakingOverview'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Liquid staking protocols
      tags:
      - Metrics - Staking
  /api/v1/metrics/staking/liquid/timeseries:
    get:
      description: Daily pooled AVAX, exchange rate and running delegations per liquid
        staking protocol (last sample of each UTC day). History starts 2026-10-31.
        Amounts are nAVAX strings. Oldest first.
      parameters:
      - description: 'Protocol id, e.g. benqi-savax (default: all)'
        in: query
        name: protocol
        type: string
      - default: 365
        description: Days back, 1-3650
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.LiquidStakingPoint'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Liquid staking history
      tags:
      - Metrics - Staking
  /api/v1/metrics/staking/timeseries:
    get:
      description: Daily active stake per subnet, sampled by the validator syncer
        (last sample of each UTC day). Primary Network rows include delegation and
        AVAX total supply. History starts 2026-10-30. Amounts are raw weight strings
        (nAVAX for the Primary Network), with staked_tokens for PoS chains. Oldest
        first.
      parameters:
      - description: 'Subnet ID (default: Primary Network)'
        in: query
        name: subnet_id
        type: string
      - default: 365
        description: Days of history, 1-3650
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.StakingPoint'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Daily staking snapshots
      tags:
      - Metrics - Staking
  /api/v1/metrics/staking/unlocks:
    get:
      description: Stake whose lock ends in each of the next N weeks (Monday-start,
        UTC), split into validator own stake and delegated stake. Delegations come
        from active AddDelegator/AddPermissionlessDelegator transactions. Amounts
        are nAVAX strings. Cached for 5 minutes.
      parameters:
      - default: 12
        description: Weeks ahead, 1-53 (the maximum staking period is one year)
        in: query
        name: weeks
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.StakingUnlockWeek'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Primary Network stake unlock schedule
      tags:
      - Metrics - Staking
  /api/v1/metrics/storage:
    get:
      description: Per-table on-disk size (bytes) and row counts, largest first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.StorageTable'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get storage stats
      tags:
      - Metrics - Indexer
  /health:
    get:
      description: Check API server and database connectivity
      produces:
      - application/json
      responses:
        "200":
          description: Healthy
          schema:
            $ref: '#/definitions/api.HealthStatus'
        "503":
          description: Unhealthy
          schema:
            $ref: '#/definitions/api.HealthStatus'
      summary: Health check
      tags:
      - Health
