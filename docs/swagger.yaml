      - default: day
        description: Time granularity (hour, day, week, month)
        in: query
        name: granularity
        type: string
      - description: Token address (0x-prefixed hex). Omit for all assets.
        in: query
        name: token
        type: string
      - description: Start time (date, RFC3339, or unix timestamp)
        in: query
        name: from
        type: string
      - description: End time (date, RFC3339, or unix timestamp)
        in: query
