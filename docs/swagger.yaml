  /api/v1/data/evm/{chainId}/tokenized-funds:
    get:
      description: 'Returns tokenized money-market funds (e.g. BlackRock BUIDL, Franklin
        Templeton BENJI) with circulating supply (excludes addresses listed in stablecoin_excluded_holders),
        holder count, and 24h transfer stats. Same shape as /stablecoins. These are
        fund shares, not stablecoins, so they are not part of the /stablecoins list.
        supply is in shares. price_usd and value_usd: peg USD funds are priced at
        $1 per share (price_source peg). Peg NAV funds have a floating share price,
        priced only when it is reported on-chain in a USD stablecoin, read every few
        minutes: the fund is an ERC-4626 vault (price_source erc4626), or its share
        token has an ERC-7540 vault such as Centrifuge''s (price_source erc7540),
        or it has a RedStone NAV feed (price_source redstone). Otherwise the price
        fields are null. A price whose NAV is more than 7 days old is null. Never
        value a NAV fund at $1.'
      parameters:
      - description: Chain ID (e.g. 43114 for Avalanche C-Chain)
        in: path
        name: chainId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
