  /api/v1/metrics/bridges:
    get:
      description: 'USD bridged into and out of the C-Chain over the last N complete
        UTC days ending as_of, in total and by bridge, counterparty chain and token.
        Tracked: Circle CCTP V1+V2, LayerZero OFTs V1+V2, Stargate V2 pools, the Avalanche
        Bridge (.e tokens to Ethereum, BTC.b to Bitcoin), Chainlink CCIP token pools
        and the 2021 AEB (ChainBridge, Ethereum). Counterparty chain keys are not
        a closed set: unmapped chains appear as raw keys such as lz:30999 or cctp:12.
        Each transfer counts once: CCIP or other legs moving native USDC through CCTP
        count as CCTP. Transactions that bridge in and out again are left out (passthrough_count).
        Stablecoins are priced at $1, wrapped ETH, BTC, AVAX and LINK at the hourly
        Chainlink price, other tokens are counted but unpriced (priced_share). Cached
        for 5 minutes.'
      parameters:
      - default: 30
        description: Complete UTC days, 1-3650
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.BridgeOverview'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: C-Chain bridge inflows and outflows
      tags:
      - Metrics - Bridges
