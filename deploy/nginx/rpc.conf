# nginx vhost for the public C-Chain RPC (rpc.l1beat.io).
# Place at /etc/nginx/sites-available/rpc.l1beat.io (symlinked from sites-enabled).
# Needs rpc-limits.conf in conf.d and njs/rpc_filter.js in /etc/nginx/njs.
#
# Only POST /ext/bc/C/rpc is public. The njs filter allows eth_/net_/web3_ methods
# (no debug_*, no filters/subscriptions), caps batches and eth_getLogs ranges, then
# forwards to the node. Every other path, including the WebSocket, P-Chain,
# info, health, metrics and index APIs, is closed. Services on this box (indexer,
# lending, bots) use 127.0.0.1:9650 directly and are not affected.

server {
    server_name rpc.l1beat.io;
    access_log /var/log/nginx/rpc.l1beat.io.access.log json_combined;
    error_log  /var/log/nginx/rpc.l1beat.io.error.log;

    limit_req_status  429;
    limit_conn_status 429;

    location = /ext/bc/C/rpc {
        limit_req  zone=rpc_ip burst=40 nodelay;
        limit_conn rpc_conn 10;
        error_page 429 = @ratelimited;

        # One memory buffer, same size as the max body, so the filter always sees the body.
        client_max_body_size         128k;
        client_body_buffer_size      128k;
        client_body_in_single_buffer on;

        # The filter's block-height lookup (localhost eth_blockNumber) gives up fast.
        js_fetch_timeout 3s;

        js_content rpc.filter;
    }

    # Reached only through r.internalRedirect from the filter. The node's reply
    # streams straight through, so large responses are never truncated.
    location @node {
        # No URI part: nginx forbids it in a named location. The redirect keeps
        # the original /ext/bc/C/rpc path, so it reaches the node unchanged.
        proxy_pass http://127.0.0.1:9650;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Content-Type application/json;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location @ratelimited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Access-Control-Allow-Origin "*" always;
        return 429 '{"jsonrpc":"2.0","id":null,"error":{"code":-32005,"message":"Rate limit exceeded, retry after 1s"}}';
    }

    # Everything else (WebSocket, P/X-Chain, /ext/info, /ext/health, /ext/metrics,
    # /ext/index, scanner probes): closed.
    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rpc.l1beat.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rpc.l1beat.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = rpc.l1beat.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name rpc.l1beat.io;
    return 404; # managed by Certbot
}
