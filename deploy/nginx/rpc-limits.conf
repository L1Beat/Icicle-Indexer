# http-level zones and njs import for the public C-Chain RPC vhost (rpc.conf).
# Place at /etc/nginx/conf.d/rpc-limits.conf. Needs Ubuntu's njs module:
#   sudo apt install libnginx-mod-http-js
# (Not nginx.org's nginx-module-njs: it only loads into nginx.org's nginx build.)

limit_req_zone  $binary_remote_addr zone=rpc_ip:20m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=rpc_conn:10m;

js_import rpc from /etc/nginx/njs/rpc_filter.js;
